aid: periodic-labs
name: Periodic Labs
description: 'Periodic Labs builds AI scientists and autonomous laboratories to accelerate
  discovery in the physical sciences. Its systems formulate hypotheses, run real-world
  experiments in self-driving labs, and learn from the results, targeting materials
  design and the search for higher-temperature superconductors, and helping industrial
  partners such as semiconductor manufacturers analyze experimental data to iterate
  faster. The company is backed by Accel, Bain Capital Ventures, Lightspeed Venture
  Partners and SV Angel. As of this profile Periodic Labs publishes no public API,
  developer portal, SDK, or documentation surface; this record captures its identity
  for the API Evangelist network.'
